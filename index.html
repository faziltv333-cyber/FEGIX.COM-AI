<!DOCTYPE html>  
<html lang="bn">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>FIJIX.co AI - Platform</title>  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
    
    <!-- Firebase SDKs (v9 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, increment } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // TODO: আপনার ফায়ারবেস কনফিগারেশন এখানে বসান
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // অ্যাপে ঢোকার সাথে সাথে চেক করবে ইউজার লগইন করা আছে কিনা
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // লগইন করা থাকলে হোম পেজ দেখাও
                document.querySelectorAll('.app-page').forEach(p => p.classList.remove('active-page'));
                document.getElementById('page-home').classList.add('active-page');
                document.querySelector('.bottom-nav').style.display = 'flex';

                const uid = user.uid;
                document.getElementById('user-id-display').innerText = uid.substring(0, 6);
                
                const userRef = doc(db, "users", uid);

                // রিয়েল-টাইম লাইভ ব্যালেন্স আপডেট
                onSnapshot(userRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        document.getElementById('profile-main-balance').innerText = '৳ ' + (data.mainBalance || 0).toLocaleString();
                        document.getElementById('profile-income').innerText = '৳ ' + (data.income || 0).toLocaleString();
                        document.getElementById('profile-total-balance').innerText = '৳ ' + (data.totalBalance || 0).toLocaleString();
                        document.getElementById('profile-total-withdraw').innerText = '৳ ' + (data.totalWithdraw || 0).toLocaleString();
                    }
                });

                // ডিপোজিট হ্যান্ডলার
                window.handleDepositSubmit = async function() {
                    const amountInput = document.getElementById('depAmount').value;
                    const amount = parseFloat(amountInput);
                    if (!amount || amount <= 0) {
                        alert('দয়া করে সঠিক অ্যামাউন্ট লিখুন।');
                        return;
                    }

                    try {
                        await updateDoc(userRef, {
                            mainBalance: increment(amount),
                            totalBalance: increment(amount)
                        });
                        alert('রিচার্জ সফলভাবে জমা হয়েছে এবং ব্যালেন্স যোগ হয়েছে!');
                        document.getElementById('depAmount').value = '';
                        switchPage('page-home');
                    } catch (error) {
                        console.error("Deposit error: ", error);
                        alert('রিচার্জ সম্পন্ন করতে সমস্যা হয়েছে।');
                    }
                };

                // উইথড্র হ্যান্ডলার
                window.handleWithdrawSubmit = async function() {
                    const amountInput = document.getElementById('wdAmount').value;
                    const amount = parseFloat(amountInput);
                    if (!amount || amount <= 0) {
                        alert('দয়া করে সঠিক অ্যামাউন্ট লিখুন।');
                        return;
                    }

                    const docSnap = await getDoc(userRef);
                    if (docSnap.exists() && docSnap.data().mainBalance >= amount) {
                        try {
                            await updateDoc(userRef, {
                                mainBalance: increment(-amount),
                                totalWithdraw: increment(amount)
                            });
                            alert('উত্তোলন সফল হয়েছে এবং ব্যালেন্স কেটে নেওয়া হয়েছে!');
                            document.getElementById('wdAmount').value = '';
                            switchPage('page-home');
                        } catch (error) {
                            console.error("Withdraw error: ", error);
                            alert('উত্তোলন সম্পন্ন করতে সমস্যা হয়েছে।');
                        }
                    } else {
                        alert('আপনার অ্যাকাউন্টে পর্যাপ্ত মেইন ব্যালেন্স নেই!');
                    }
                };

            } else {
                // লগইন না করা থাকলে অথ (লগইন/রেজিস্ট্রেশন) পেজ দেখাও
                document.querySelectorAll('.app-page').forEach(p => p.classList.remove('active-page'));
                document.getElementById('page-auth').classList.add('active-page');
                document.querySelector('.bottom-nav').style.display = 'none';
            }
        });

        // রেজিস্ট্রেশন ফাংশন (সফল হলে হোম পেজে যাবে)
        window.handleRegister = async function() {
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            if(!email || !pass) {
                alert('দয়া করে ইমেল এবং পাসওয়ার্ড দিন।');
                return;
            }
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                const uid = userCred.user.uid;
                await setDoc(doc(db, "users", uid), {
                    mainBalance: 5000.00,
                    income: 1850.00,
                    totalBalance: 12500.00,
                    totalWithdraw: 3000.00
                });
                alert('রেজিস্ট্রেশন সফল হয়েছে!');
                switchPage('page-home');
            } catch (error) {
                alert('রেজিস্ট্রেশন ত্রুটি: ' + error.message);
            }
        };

        // লগইন ফাংশন (সফল হলে হোম পেজে যাবে)
        window.handleLogin = async function() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            if(!email || !pass) {
                alert('দয়া করে ইমেল এবং পাসওয়ার্ড দিন।');
                return;
            }
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                alert('লগইন সফল হয়েছে!');
                switchPage('page-home');
            } catch (error) {
                alert('লগইন ব্যর্থ হয়েছে: ' + error.message);
            }
        };

        // লগআউট ফাংশন
        window.handleLogout = async function() {
            await signOut(auth);
            location.reload();
        };
    </script>

    <style>  
        :root {  
            --primary-blue: #00b0ff;  
            --secondary-blue: #0061ff;

            font-size: 12px;

        .badge-tag {

            position: absolute;  
            width: 50%;  
            height: 50%;  
            transform-origin: 100% 100%;  
            left: 0; top: 0;  
            display: flex;  
            align-items: center;  
            justify-content: center;  
            font-size: 11px;  
            font-weight: bold;  
            color: #333;

        .wheel-item:nth-child(3) { transform: rotate(180deg) skewY(-30deg); background: #b2ebf2; }  
        .wheel-item:nth-child(4) { transform: rotate(270deg) skewY(-30deg); background: #80deea; }

            top: -12px;  
            left: 50%;  
            transform: translateX(-50%);

<!-- ================= 0. AUTH PAGE (LOGIN & REGISTER) ================= -->  
<div id="page-auth" class="app-page">  
    <div class="top-header" style="text-align: center; border-radius: 0 0 25px 25px; padding: 30px 15px;">  
        <h2>FIJIX.co AI</h2>  
        <p style="font-size: 12px; opacity: 0.9;">দয়া করে লগইন বা রেজিস্ট্রেশন করুন</p>  
    </div>  

    <div class="form-card" style="marg
